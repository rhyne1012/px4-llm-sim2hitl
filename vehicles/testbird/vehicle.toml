# Testbird in PX4: how PX4's outputs drive the JSBSim model, and the pilot's numbers. Its PX4 airframe and parameters
# are in its recipe (recipes/cubeorangeplus_hitl/params.json).

[vehicle]
name = "testbird"
jsbsim_model = "testbird"


# HIL_ACTUATOR_CONTROLS channel (0-based) -> JSBSim property; the property gets sum(gain * output + offset).
# kind "servo" outputs go through the servo signal chain (avionics/servo_chain.h: PWM hold, then delay; off unless a
# configuration sets avionics/servo/*); "motor" outputs do not.
# Airframe 1033 outputs: 2 rudder (CS3), 3 left flap, 4 motor, 5 left aileron (CS0), 6 right aileron (CS1),
# 7 elevator (CS2), 8 right flap.
# PX4 signs: a positive deflection produces the torque in CA_SV_CSn_TRQ_* (elevator +1 pitch up, rudder +1 yaw right,
# left aileron -0.5 roll, right aileron +0.5 roll). Testbird signs (Systems/controls.xml): elevator + nose down,
# aileron + roll right, rudder + nose right.
[[actuators]]
channel = 4
property = "fcs/throttle-cmd-norm"
kind = "motor"
gain = 1.0

[[actuators]]
channel = 7
property = "fcs/elevator-cmd-norm"
kind = "servo"
gain = -1.0

[[actuators]]
channel = 5
property = "fcs/aileron-cmd-norm"
kind = "servo"
gain = -0.5

[[actuators]]
channel = 6
property = "fcs/aileron-cmd-norm"
kind = "servo"
gain = 0.5

[[actuators]]
channel = 2
property = "fcs/rudder-cmd-norm"
kind = "servo"
gain = 1.0

[start]
agl_m = 0.19                 # CG height at rest on the gear
heading_deg = 0.0

[pilot]                      # tools/pilot.py: a runway takeoff with sticks (docs/pilot.md)
takeoff_throttle = 1.0       # full throttle: 17.5 m/s after 10 s on the runway (tests/test_simhost_fake_px4.py)
cruise_throttle = 0.64       # level flight at 17 m/s (README)
rotate_cas = 13.0            # pitch up at FW_AIRSPD_MIN; stall is about 10.1 m/s
climb_pitch = 10.0
altitude = 60.0
altitude_gain = 0.5
climb_damping = 1.0
rate = 50
