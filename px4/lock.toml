# The PX4 this toolkit version is tested with. Builds use a tree at exactly this commit; patches are a last resort,
# each one adds or changes as little as possible, and each is listed here with why.
# The git commit is the fingerprint (it fixes every submodule too); no backup copy of the tree is kept (decided
# 2026-11-28: PX4 is unlikely to disappear; a copy in the cloud may come later).
[px4]
tag = "v1.18.0"
commit = "935addf1d6bec6e955b155494a52e7eb4b750eb3"

[[patches]]
file = "patches/cubeorangeplus_hil_variant.patch"
boards = ["cubepilot_cubeorangeplus"]
why = "the default Cube Orange+ build has no pwm_out_sim, which HITL needs; adds one board-variant file"

[[patches]]
file = "patches/sitl/vehicle_imu_first_sample.patch"
builds = ["sitl"]
why = "with simhost the sensors start seconds after PX4 boots; PX4's IMU integrators then take all that time as the first interval and calibration and EKF2 can start from a tilted gravity vector; the patch seeds them at zero dt (one file, sensors/vehicle_imu)"

[builds.sitl]
target = "px4_sitl_default"          # with the SITL patches above (tools/sitl_fc.py applies every px4/patches/sitl/ patch)

[builds.cubeorangeplus_hitl]
target = "cubepilot_cubeorangeplus_hil"
patches = ["patches/cubeorangeplus_hil_variant.patch"]
